server:
  port: 8081

spring:
  application:
    name: drug-service
  datasource:
    url: jdbc:postgresql://localhost:5432/pharmacore_drug
    username: pharmacore
    password: pharmacore
  jpa:
    hibernate:
      ddl-auto: create-drop    # ← create-drop pour dev, validate en prod
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    com.pharmacore: DEBUG
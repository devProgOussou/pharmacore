services:
  postgres:
    image: postgres:16-alpine
    container_name: pharmacore-postgres
    environment:
      POSTGRES_DB: pharmacore_drug
      POSTGRES_USER: pharmacore
      POSTGRES_PASSWORD: pharmacore
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - pharmacore-net

networks:
  pharmacore-net:
    driver: bridge

volumes:
  pgdata:
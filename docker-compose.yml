services:
  postgres:
    image: postgres:16-alpine
    container_name: pharmacore-postgres
    environment:
      POSTGRES_DB: pharmacore_drug
      POSTGRES_USER: pharmacore
      POSTGRES_PASSWORD: pharmacore
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - pharmacore-net

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: pharmacore-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - pharmacore-net

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: pharmacore-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: true
    networks:
      - pharmacore-net

networks:
  pharmacore-net:
    driver: bridge

volumes:
  pgdata:
